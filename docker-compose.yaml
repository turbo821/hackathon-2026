services:
  # Прокси для исходящих соединений контейнеров.
  #
  # Схема: контейнеры -> xray (SOCKS5/HTTP на 1080/8080) -> интернет.
  # xray резолвит домены сам и берёт только IPv4: без этого Telegram
  # отдаёт IPv6-адрес, который дальше по цепочке отклоняется (socks5 code=4).
  #
  # Порт xray опубликован только на 127.0.0.1 сервера — снаружи (в интернет)
  # прокси не видно. Из контейнеров к нему идут по имени сервиса `xray`.
  #
  # Если на сервере поднят Cloudflare WARP в режиме туннеля
  # (`warp-cli --accept-tos mode warp && warp-cli --accept-tos connect`),
  # трафик контейнеров уходит на хост и дальше в туннель WARP.
  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray-proxy
    restart: unless-stopped
    command: ["run", "-config", "/etc/xray/config.json"]
    # network_mode: host — xray должен достучаться до WARP-апстрима на
    # 127.0.0.1:40000 (он слушает только loopback хоста, из bridge-сети
    # недоступен). Взамен xray слушает только docker0 (172.17.0.1), поэтому
    # прокси не виден из интернета.
    network_mode: host
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    # В образе нет shell/nc, поэтому проверяем конфиг самим бинарём xray:
    # так ловится сломанный или не подхваченный монтированием конфиг.
    healthcheck:
      test: ["CMD", "/usr/local/bin/xray", "run", "-test", "-config", "/etc/xray/config.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Панель: статика, собранная Vite, раздаётся через nginx.
  # Запросы в API (/api/v1/...) nginx перенаправляет в бэкенд внутри сети —
  # браузеру не нужно знать адрес бэкенда, и CORS не требуется.
  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        # Адрес API вшивается в образ на этапе сборки (Vite подставляет
        # import.meta.env.VITE_API_URL при build). Относительный — панель ходит
        # в /api на своём origin, nginx проксирует его в бэкенд.
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    ports:
      - "5173:80" # снаружи 5173 (адрес панели не меняется), внутри nginx слушает 80
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend_data:/app/instance
    # Исходящие HTTP(S)-запросы (Telegram, внешние API) — через xray.
    # NO_PROXY оставляет внутренние адреса (свой бэкенд, соседние сервисы)
    # напрямую, иначе они уедут в прокси и сломаются.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ALL_PROXY: ${PROXY_URL:-}
      HTTP_PROXY: ${PROXY_URL:-}
      HTTPS_PROXY: ${PROXY_URL:-}
      NO_PROXY: localhost,127.0.0.1,::1,backend,frontend,worker,xray
      BOT_PROXY_URL: ${BOT_PROXY_URL:-}
      SMTP_PROXY: ${SMTP_PROXY:-}
    depends_on:
      - xray
    restart: unless-stopped
    networks:
      - app-network

  worker:
    build: ./backend
    env_file: .env
    # entrypoint переопределён: миграции и сиды выполняет сервис backend,
    # иначе два процесса будут одновременно менять одну SQLite-базу.
    entrypoint: ["python", "-m", "app.worker"]
    volumes:
      - ./backend:/app
      - backend_data:/app/instance
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ALL_PROXY: ${PROXY_URL:-}
      HTTP_PROXY: ${PROXY_URL:-}
      HTTPS_PROXY: ${PROXY_URL:-}
      NO_PROXY: localhost,127.0.0.1,::1,backend,frontend,worker,xray
      BOT_PROXY_URL: ${BOT_PROXY_URL:-}
      SMTP_PROXY: ${SMTP_PROXY:-}
    depends_on:
      - backend
      - xray
    restart: unless-stopped
    networks:
      - app-network

volumes:
  backend_data:

networks:
  app-network:
    driver: bridge
