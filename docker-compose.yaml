services:
  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray-proxy
    restart: unless-stopped
    ports:
      - "1080:1080"
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend_data:/app/instance
    restart: unless-stopped
    depends_on:
      - xray
    environment:
      # Явно указываем бекэнду использовать SOCKS5 прокси внутри Docker-сети
      - BOT_PROXY_URL=socks5://xray:1080

  worker:
    build: ./backend
    env_file: .env
    entrypoint: ["python", "-m", "app.worker"]
    volumes:
      - ./backend:/app
      - backend_data:/app/instance
    depends_on:
      - backend
      - xray
    restart: unless-stopped
    environment:
      - BOT_PROXY_URL=socks5://xray:1080

volumes:
  backend_data: