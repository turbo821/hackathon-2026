server {
    listen 80;
    server_name _;

    # Docker DNS: 127.0.0.11 — встроенный резолвер compose-сетей.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Файлы Vite с хешем в имени (assets/index-abc123.js) не меняются — кешируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кешируем: после пересборки браузер сразу получит новую версию
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API — на бэкенд внутри docker-сети. Фронт ходит в /api/v1/... на том же
    # origin, откуда открыт, поэтому CORS не нужен: nginx отдаёт ответ с
    # Origin панели, а бэкенд разрешает его (CORS_ORIGINS).
    #
    # Имя бэкенда резолвится через resolver, а не при старте nginx: docker
    # поднимает сервисы параллельно, и если бэкенд ещё не встал, nginx с
    # proxy_pass на имя просто не запустится («host not found in upstream»).
    location /api/ {
        set $backend_upstream backend:5000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Запросы могут идти долго (long polling Telegram в backend не торчит наружу,
        # но отчёты и импорт — да): не обрываем соединение на минуте по умолчанию.
        proxy_read_timeout 120s;
    }

    # Панель — одна страница: неизвестные пути отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
