server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Файлы Vite с хешем в имени (assets/index-abc123.js) не меняются — кешируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кешируем: после пересборки браузер сразу получит новую версию
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Панель — одна страница: неизвестные пути отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
