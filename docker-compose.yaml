services:
  # API
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend_data:/app/instance
    restart: unless-stopped

  # Панель
  frontend:
    build:
      context: ./frontend
      args:
        # Реестр npm для сборки. Меняется в .env: NPM_REGISTRY=...
        # Нужен там, где официальный реестр недоступен (IPv4 до Cloudflare закрыт).
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  # Фоновые напоминания в Telegram.
  # entrypoint переопределён: миграции и сиды выполняет сервис backend,
  # иначе два процесса будут одновременно менять одну SQLite-базу.
  worker:
    build: ./backend
    env_file: .env
    # entrypoint переопределён: миграции и сиды выполняет сервис backend,
    # иначе два процесса будут одновременно менять одну SQLite-базу.
    entrypoint: ["python", "-m", "app.worker"]
    volumes:
      - ./backend:/app
      - backend_data:/app/instance
    depends_on:
      - backend
      - xray
    restart: unless-stopped
    networks:
      - app-network

volumes:
  backend_data:

networks:
  app-network:
    driver: bridge
