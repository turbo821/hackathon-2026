services:
  # Прокси для исходящих соединений контейнеров.
  # Нужен там, где из Docker не достучаться до Telegram и npm-реестра
  # (например, IPv4 к Cloudflare закрыт, а у контейнеров нет IPv6).
  #
  # Схема: контейнеры -> SOCKS5 (этот сервис) -> SOCKS5 WARP (127.0.0.1:40000) -> интернет.
  # network_mode: host — контейнер делит сетевой стек с хостом, поэтому
  # доходит до WARP, который слушает только на loopback.
  # SOCKS5 слушает 172.17.0.1 (docker0), а не 0.0.0.0 — снаружи недоступен.
  #
  # В proxy/sing-box.json у апстрима стоит domain_strategy: prefer_ipv4.
  # Это обязательно: без него sing-box отдаёт WARP IPv6-адрес (api.telegram.org
  # резолвится в 2001:...), а WARP-прокси такие адреса не проксирует и
  # отвечает socks5 code=4.
  #
  # Включается профилем: docker compose --profile proxy up -d
  # Без профиля сервисы работают как обычно (PROXY_URL пустой — прокси нет).
  proxy:
    image: ghcr.io/sagernet/sing-box:latest
    network_mode: host
    profiles: ["proxy"]
    restart: unless-stopped
    volumes:
      - ./proxy/sing-box.json:/etc/sing-box/config.json:ro
    command: ["run", "-c", "/etc/sing-box/config.json"]

  # API
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      # База — в отдельном томе, а не в bind-mount: SQLite в режиме WAL
      # не работает на bind-mount Docker Desktop поверх Windows
      # (не создаётся -wal/-shm, новое соединение падает с
      # «unable to open database file»). Том — обычная Linux-ФС, всё работает.
      - backend_data:/app/instance
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Исходящие HTTP(S)-запросы (Telegram) — через прокси.
      # SMTP (Mail.ru) прокси не поддерживает, но он и так доступен напрямую.
      ALL_PROXY: ${PROXY_URL:-}
      NO_PROXY: localhost,127.0.0.1,db,backend,worker,proxy
    restart: unless-stopped

  # Панель: статика, собранная Vite, раздаётся через nginx.
  frontend:
    build:
      context: ./frontend
      args:
        # Реестр npm для сборки. Меняется в .env: NPM_REGISTRY=...
        # Нужен там, где официальный реестр недоступен (IPv4 до Cloudflare закрыт).
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    env_file: .env
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Фоновые напоминания в Telegram.
  # entrypoint переопределён: миграции и сиды выполняет сервис backend,
  # иначе два процесса будут одновременно менять одну SQLite-базу.
  worker:
    build: ./backend
    env_file: .env
    entrypoint: ["python", "-m", "app.worker"]
    volumes:
      - ./backend:/app
      - backend_data:/app/instance
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ALL_PROXY: ${PROXY_URL:-}
      NO_PROXY: localhost,127.0.0.1,db,backend,worker,proxy
    depends_on:
      - backend
    restart: unless-stopped