services:
  # Прокси для исходящих соединений контейнеров.
  # Нужен там, где из Docker не достучаться до Telegram и npm-реестра
  # (например, IPv4 к Cloudflare закрыт, а у контейнеров нет IPv6).
  #
  # network_mode: host — контейнер делит сетевой стек с хостом, поэтому
  # его исходящие соединения идут по маршрутам хоста (в том числе через WARP).
  # Порт 1080 слушается на хосте, контейнеры видят его как
  # host.docker.internal:1080 (адрес docker0, 172.17.0.1).
  #
  # Включается профилем: docker compose --profile proxy up -d
  # Без профиля сервисы работают как обычно (PROXY_URL пустой — прокси нет).
  proxy:
    image: serjs/go-socks5-proxy:latest
    network_mode: host
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      PROXY_USER: ${PROXY_USER:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}

  # API
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend_data:/app/instance
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Исходящие HTTP(S)-запросы (Telegram) — через прокси.
      # SMTP (Mail.ru) прокси не поддерживает, но он и так доступен напрямую.
      ALL_PROXY: ${PROXY_URL:-}
      NO_PROXY: localhost,127.0.0.1,db,backend,worker,proxy
    restart: unless-stopped

  # Панель
  frontend:
    build:
      context: ./frontend
      args:
        # Реестр npm для сборки. Меняется в .env: NPM_REGISTRY=...
        # Нужен там, где официальный реестр недоступен (IPv4 до Cloudflare закрыт).
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  # Фоновые напоминания в Telegram.
  # entrypoint переопределён: миграции и сиды выполняет сервис backend,
  # иначе два процесса будут одновременно менять одну SQLite-базу.
  worker:
    build: ./backend
    env_file: .env
    # entrypoint переопределён: миграции и сиды выполняет сервис backend,
    # иначе два процесса будут одновременно менять одну SQLite-базу.
    entrypoint: ["python", "-m", "app.worker"]
    volumes:
      - ./backend:/app
      - backend_data:/app/instance
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ALL_PROXY: ${PROXY_URL:-}
      NO_PROXY: localhost,127.0.0.1,db,backend,worker,proxy
    depends_on:
      - backend
      - xray
    restart: unless-stopped
    networks:
      - app-network

volumes:
  backend_data:

networks:
  app-network:
    driver: bridge
