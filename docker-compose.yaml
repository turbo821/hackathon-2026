services:
  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray-proxy
    restart: unless-stopped
    ports:
      - "1080:1080"
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    networks:
          - app-network

  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
      - backend_data:/app/instance
    restart: unless-stopped
    depends_on:
      - xray
    networks:
          - app-network

  worker:
    build: ./backend
    env_file: .env
    depends_on:
      - backend
      - xray
    restart: unless-stopped
    networks:
          - app-network

volumes:
  backend_data:

networks:
  app-network:
    driver: bridge