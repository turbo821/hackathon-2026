services:
  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray-proxy
    restart: unless-stopped
    ports:
      - "1080:1080"
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend_data:/app/instance
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Исходящие HTTP(S)-запросы (Telegram) — через прокси.
      # SMTP (Mail.ru) прокси не поддерживает, но он и так доступен напрямую.
      ALL_PROXY: ${PROXY_URL:-}
      NO_PROXY: localhost,127.0.0.1,db,backend,worker,proxy
    restart: unless-stopped
    depends_on:
      - xray


  worker:
    build: ./backend
    env_file: .env
    entrypoint: ["python", "-m", "app.worker"]
    volumes:
      - ./backend:/app
      - backend_data:/app/instance
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ALL_PROXY: ${PROXY_URL:-}
      NO_PROXY: localhost,127.0.0.1,db,backend,worker,proxy
    depends_on:
      - backend
      - xray
    restart: unless-stopped

volumes:
  backend_data: