services:
  # API
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      # База — в отдельном томе, а не в bind-mount: SQLite в режиме WAL
      # не работает на bind-mount Docker Desktop поверх Windows
      # (не создаётся -wal/-shm, новое соединение падает с
      # «unable to open database file»). Том — обычная Linux-ФС, всё работает.
      - backend_data:/app/instance
    restart: unless-stopped

  # Панель: статика, собранная Vite, раздаётся через nginx.
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Фоновые напоминания в Telegram.
  # entrypoint переопределён: миграции и сиды выполняет сервис backend,
  # иначе два процесса будут одновременно менять одну SQLite-базу.
  worker:
    build: ./backend
    env_file: .env
    entrypoint: ["python", "-m", "app.worker"]
    volumes:
      - ./backend:/app
      - backend_data:/app/instance
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  # База данных. Живёт отдельно от кода — чтобы SQLite-файл был на
  # нормальной ФС (см. комментарий у сервиса backend).
  backend_data:
